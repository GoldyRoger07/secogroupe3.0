    <!-- Mobile Menu -->
    <!-- Mobile menu: backdrop + right-side sliding panel -->
    <div class="fixed inset-0 z-40 md:hidden pointer-events-none" [class.pointer-events-auto]="isMobileMenuOpen">
      <!-- Backdrop -->
      <div (click)="closeMobileMenu()" class="absolute inset-0 bg-black/40 transition-opacity duration-300" [class.opacity-100]="isMobileMenuOpen" [class.opacity-0]="!isMobileMenuOpen"></div>

      <!-- Sliding panel (right side) -->
      <aside class="absolute top-0 right-0 h-full w-72 bg-white shadow-xl transform transition-transform duration-300 ease-in-out"
             [class.translate-x-0]="isMobileMenuOpen"
             [class.translate-x-full]="!isMobileMenuOpen">
        <div class="p-4 flex items-center justify-between border-b">
          <div class="text-lg font-semibold">Menu</div>
          <button (click)="closeMobileMenu()" aria-label="Close menu" class="p-2 focus:outline-none">
            <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>

        <nav class="p-6 flex flex-col space-y-4">
          <a routerLink="/home" (click)="closeMobileMenu()" class="text-gray-700 hover:text-(--my-sec-bg) text-lg">Home</a>
          <a routerLink="/about-us" (click)="closeMobileMenu()" class="text-gray-700 hover:text-(--my-sec-bg) text-lg">About</a>
          <a routerLink="/services" (click)="closeMobileMenu()" class="text-gray-700 hover:text-(--my-sec-bg) text-lg">Services</a>
          <a routerLink="/contact" (click)="closeMobileMenu()" class="text-gray-700 hover:text-(--my-sec-bg) text-lg">Contact</a>

          <div class="pt-4 border-t">
            <p-select [options]="countries" [(ngModel)]="selectedCountry" optionLabel="name" placeholder="Select a Language" class="w-full" />
          </div>
        </nav>
      </aside>
    </div>
